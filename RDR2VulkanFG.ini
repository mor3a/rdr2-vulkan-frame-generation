; RDR2 Vulkan Frame Generation 0.82
; Vulkan and in-game DLSS are required.
; Edit advanced settings with the game closed.
[fgvk]
Enabled=1
DebugLogging=0
ConfigVersion=2
ApplicationId=0x60E8AB7

; DLSSG or XeSS. Provider changes involving Native DLSS-G need a game restart.
FGProvider=DLSSG
; Native (default) or Bridge. Change in the INI, then restart the game.
DLSSGBackend=Native
; Neutral (default) or Derived. Change requires a game restart.
CameraSource=Neutral
CameraMaxAgeMs=50
CameraAudit=0

; Generated frames: 1=2x, 2=3x, 3=4x. Runtime capability limits apply.
DLSSGFrames=1
; DLSS-G preset: 0=profile/default, 1=A, 2=B, 3=C.
DLSSGPreset=3
UserFGOff=0
ShowFPS=1
FPSCap=0
OutputFPSCap=0
MenuScale=1.00
MenuKey=0x2D
KeyToggleFG=0x6A
KeyCycleFrames=0x23

AntiTearing=0
AntiGhostHistory=1
DepthSeparation=10.00
; Native DLSS-G latency mode: 1=On, 2=On + Boost.
ReflexMode=1
; Native Vulkan SDK wait: 0=default, 1=enabled. Restart the game after changes.
; This setting does not control XeSS or its frame pacing.
ReflexSleep=0
TagHUDLess=0
; Native HUD protection (Experimental): same-frame final-color capture.
NativeHUDProtection=1
TagUI=0
PresentPacing=0
MvecScaleNormalized=1
OnAfterEvalFrames=60
OffAfterIdleFrames=3
NoDLSSGraceMs=100
EnableExperimentalRTX20=0

; Optional diagnostics; keep disabled for normal play.
Diagnostics=0
IntervalLogging=0
