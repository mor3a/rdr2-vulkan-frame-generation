; RDR2 Vulkan Frame Generation 0.30. Provider is read at launch.
[fgvk]
; Set to 1 for detailed diagnostics. Read at game startup.
DebugLogging=0
ConfigVersion=2
Enabled=1
FGProvider=DLSSG
EnableExperimentalRTX20=0
ApplicationId=0x60E8AB7
; DLSS-G: 1=2x, 2=3x. FSR3: 2x only.
DLSSGFrames=1
UserFGOff=0
ReflexMode=2
ReflexSleep=0
TagHUDLess=0
TagUI=0
PresentPacing=0
; Frame rate limit on the present thread in frames per second (0 = unlimited). Can also be set in the menu.
FPSCap=0
MvecScaleNormalized=1
OnAfterEvalFrames=60
OffAfterIdleFrames=3
NoDLSSGraceMs=100
KeyToggleFG=0x6A
KeyCycleFrames=0x23
ShowFPS=1
BenchmarkFG=0
FSRHUDCapture=1
FSRHUDStrict=1
FSRHUDProtection=0
FSRHUDRect1=2,70,18,28
FSRHUDRect2=78,2,20,15
FSRHUDRect3=
FSRHUDRect4=
FSRHUDRect5=
FSRHUDRect6=
FSRHUDRect7=
FSRHUDRect8=

; Menu open/close key as a Windows virtual-key code (0x2D = Insert). Can also be changed in the menu.
MenuKey=0x2D
; Menu scale factor (0.8 to 1.5). Can also be changed in the menu.
MenuScale=1
